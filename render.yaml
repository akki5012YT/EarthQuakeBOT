# ===================================================
# Render Blueprint Configuration (render.yaml)
# 完全 Docker デプロイ設定
# ===================================================

services:
  # Docker Web Service (ダッシュボード + 地震自動ポーリング + ヘルスチェック)
  - type: web
    name: chatwork-earthquake-bot
    env: docker
    dockerfilePath: ./Dockerfile
    plan: free # または starter
    region: singapore # または oregon, frankfurt 等
    healthCheckPath: /healthz
    envVars:
      - key: PORT
        value: 10000
      - key: CHATWORK_API_TOKEN
        sync: false # RenderダッシュボードのEnvironmentで入力
      - key: CHATWORK_ROOM_ID
        sync: false # 通知先ChatworkルームIDを入力
      - key: MIN_NOTIFICATION_SCALE
        value: "30" # 30: 震度3以上 (※ 45: 震度5弱以上で自動[toall])
      - key: POLL_INTERVAL_SECONDS
        value: "15" # 15秒間隔で気象庁APIをチェック
